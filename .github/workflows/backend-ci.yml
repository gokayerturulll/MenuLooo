name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'db/**'
      - 'docker-compose*.yml'
      - 'scripts/smoke_test.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'db/**'
      - 'docker-compose*.yml'
      - 'scripts/smoke_test.sh'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Coverage eşiği jest.config.js'te tanımlı — altına düşerse bu adım kırılır.
      - run: npm run test:coverage

      - name: Coverage raporunu sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage/lcov-report/
          retention-days: 7

  # test ile PARALEL çalışır — lint hatası testlerin sonucunu gizlemesin diye
  # aynı job'a step olarak eklenmedi.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

  # Bilinen zafiyetli bağımlılıkları yakalar.
  #   --omit=dev    : jest/eslint gibi araçların zafiyetleri üretim image'ına
  #                   GİRMEZ (Dockerfile --omit=dev ile kuruyor) ve çoğu ancak
  #                   aracı eski sürüme almakla "düzeliyor" → CI'ı kırmasınlar.
  #   --audit-level : sadece high/critical bloklar; moderate uyarıları PR'ı durdurmaz.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Üretim bağımlılıklarında bilinen zafiyet var mı
        run: npm audit --omit=dev --audit-level=high

  # Git GEÇMİŞİNDE sızmış sır (API key, token, şifre) arar.
  # Yanlış pozitifler .gitleaks.toml içinde dar kapsamlı olarak muaf tutulur.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ZORUNLU: varsayılan sığ klonda geçmiş taranamaz

      - name: Gitleaks ile sır taraması
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --no-banner

  # Birim testler kodu, bu job SİSTEMİ doğrular: db → migrate → backend zinciri
  # gerçekten ayağa kalkıyor mu?
  #
  # Neden gerekli: `docker build` image'ı yalnızca KURAR, çalıştırmaz. postgres
  # 16 → 18 denemesi (PR #2) tam olarak bu yüzden tüm kontrollerden geçmişti;
  # uzantılar 16 klasörüne kurulduğu için migration'daki CREATE EXTENSION
  # çalışma anında patlıyordu, build anında değil.
  #
  # Detaylar ve kontrol listesi: scripts/smoke_test.sh
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # env_file "required: false" ve "!override" merge etiketi Compose 2.24+ ister.
      # Sürümü log'a basmak, runner imajı eskirse teşhisi kolaylaştırır.
      - run: docker compose version

      - name: Smoke test — servisler gerçekten ayağa kalkıyor mu
        run: ./scripts/smoke_test.sh

  docker-build:
    runs-on: ubuntu-latest
    # integration da kapıda: ayağa kalkmayan bir image Docker Hub'a çıkmasın.
    needs: [ test, lint, audit, secret-scan, integration ]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Backend image build edilebiliyor mu
        run: docker build -t menulo-backend:ci ./backend

      - name: DB image build edilebiliyor mu
        run: docker build -t menulo-db:ci ./db

      # RAPOR AMAÇLI (exit-code 0) — bilinçli tercih:
      # Bulguların çoğu node:20-alpine base image'ının ve içindeki npm'in kendi
      # bağımlılıklarından geliyor; bu repodan düzeltilemezler. Bunlara kapı
      # koymak CI'ı kalıcı kırmızıya çevirir ve tarama görmezden gelinmeye başlar.
      # Uygulamanın KENDİ bağımlılıklarını zaten `audit` job'ı bloklayarak koruyor.
      # Base image güncellendikçe buradaki liste kısalmalı; sıfırlandığında
      # --exit-code 1 eklenip gerçek kapıya dönüştürülebilir.
      - name: Trivy ile image zafiyet taraması (rapor)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:latest image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress --exit-code 0 \
              --format sarif -o /out/trivy-results.sarif \
              menulo-backend:ci

      - name: Trivy sonuçlarını log'da göster
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress --exit-code 0 \
              menulo-backend:ci

      # Security sekmesine yükler. Private repo + Advanced Security yoksa bu adım
      # başarısız olabilir; taramanın kendisi log'da zaten görünür olduğu için
      # continue-on-error ile CI'ı kırmasına izin verilmiyor.
      - name: SARIF sonucunu Security sekmesine yükle
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # ── Push, build ve tarama ile AYNI job içinde ────────────────────────────
      # Eskiden push ayrı bir job'da sıfırdan yeniden build ediyordu. Bu, taranan
      # image ile yayınlanan image'ın FARKLI olması demekti: node:20-alpine
      # değişebilir bir etiket olduğu için iki build farklı içerik üretebilir.
      # Burada `docker tag` yalnızca yeni bir isim takar — katmanlar ve dolayısıyla
      # digest aynı kalır, yani Trivy'nin taradığı image'ın ta kendisi push edilir.
      - name: Docker Hub'a giriş yap
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest'e ek olarak :sha-<commit> — geri dönülebilirlik için şart.
      # Yalnızca :latest varken "dün çalışan sürüme dön" mümkün değil, çünkü
      # dünkü image'ın üstüne yazılmış olur.
      - name: Taranan image'ları etiketle ve push et
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for name in backend db; do
            for tag in latest "$SHA_TAG"; do
              docker tag "menulo-$name:ci" "$DOCKERHUB_USER/menulo-$name:$tag"
              docker push "$DOCKERHUB_USER/menulo-$name:$tag"
            done
          done
          echo "Yayınlanan etiketler: latest, $SHA_TAG"

      # Yalnızca raporlama: hangi digest'in yayınlandığı iş özetinde görünsün ki
      # geri dönüş gerektiğinde hedef sabit olsun. Push başarılıyken salt bilgi
      # amaçlı bir adım job'ı kırmızıya çevirmesin diye continue-on-error.
      - name: Yayınlanan digest'leri özetle
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "### Docker Hub'a yayınlandı"
            echo ""
            echo "| Image | Etiketler | Digest |"
            echo "| --- | --- | --- |"
            for name in backend db; do
              digest=$(docker inspect \
                --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' \
                "$DOCKERHUB_USER/menulo-$name:latest" 2>/dev/null | cut -d@ -f2)
              echo "| menulo-$name | \`latest\`, \`sha-${GITHUB_SHA::7}\` | \`${digest:-alınamadı}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
