# CI smoke test override — docker-compose.yml ile BİRLİKTE kullanılır:
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build backend
#
# Amaç: CI'ın "image build ediliyor mu?" sorusunun ötesine geçip "bu image
# gerçekten AYAĞA KALKIYOR mu?" sorusunu yanıtlamak. docker build yalnızca
# imajı kurar; postgres 16→18 denemesinin (PR #2) tüm kontrollerden geçip yine
# de çalışmayacak olmasının sebebi tam olarak buydu.
#
# Burada ayağa kalkan zincir: db → migrate → backend
# (cadvisor/prometheus/grafana başlatılmaz — `up backend` yalnızca backend'in
#  depends_on zincirini çeker; cadvisor'ın privileged + macOS'a özel socket
#  mount'u zaten Linux runner'da çalışmaz.)
#
# ── image: satırları neden var? ───────────────────────────────────────────────
# Base compose'da servisler yalnızca `build:` tanımlıyor, yani compose her
# seferinde KENDİ image'ını build ediyordu. CI'da bu, smoke test'in doğruladığı
# image ile Trivy'nin tarayıp Docker Hub'a push ettiği image'ın FARKLI iki build
# olması demekti — `node:20-alpine` değişebilir bir etiket ve `npm ci` registry'den
# çekiyor, iki build farklı içerik üretebilir.
#
# Aşağıdaki `image:` etiketleri, workflow'un önceden build ettiği image'ları
# işaret ediyor. SKIP_BUILD=1 ile çağrıldığında compose bu image'ları olduğu gibi
# kullanır; yani "ayağa kalktığı kanıtlanan image" ile "yayınlanan image" artık
# aynı digest.
#
# Yerelde (SKIP_BUILD olmadan) davranış değişmiyor: `--build` bayrağı image'ı
# yine build eder, sadece bu isimle etiketler.

services:

  db:
    image: menulo-db:ci

  # CI'da .env yok; migrate DB değişkenlerini zaten base compose'dan alıyor.
  migrate:
    image: menulo-backend:ci
    restart: "no"

  # Gemini API çağrısı yapılamaz (ve yapılmamalı — CI'da ücretli dış servis
  # çağrısı istemiyoruz). Servis yine de "başarıyla tamamlandı" durumuna geçmeli,
  # yoksa backend'in depends_on koşulu hiç sağlanmaz.
  #
  # Bu, embedding'lerin doğruluğunu test etmez — ama etmesi de gerekmiyor:
  # pgvector/PostGIS uzantılarının gerçekten kurulu ve kullanılabilir olduğunu
  # 001_initial_schema.sql'deki CREATE EXTENSION + HNSW index zaten migrate
  # adımında kanıtlıyor.
  seed-embeddings:
    image: menulo-backend:ci
    command: [ "node", "-e", "console.log('CI: embedding seed adımı atlandı.')" ]

  backend:
    image: menulo-backend:ci
    # CI'da yeniden başlatma kapalı: çöken container sessizce ayağa kalkıp
    # hatayı gizlemesin, testi kırsın.
    restart: "no"
    # !override → base compose'daki port listesinin ÜSTÜNE eklenmez, onun YERİNE
    # geçer. Smoke test'i 3010'dan sürmek, geliştirme ortamında 3000'de zaten
    # çalışan bir backend varken de testi çalıştırabilmeyi sağlar.
    ports: !override
      - "3010:3000"
    environment:
      # Üretimde çalışacak yolu test ediyoruz — production'a özel açılış
      # kontrolleri (ALLOWED_ORIGINS zorunluluğu, trust proxy) de kapsama girsin.
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000
      # Sadece CI içindir; server.js en az 32 karakter şartı koyuyor.
      JWT_SECRET: ci-smoke-test-jwt-secret-32-characters-minimum
